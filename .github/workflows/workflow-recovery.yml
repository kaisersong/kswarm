name: Workflow recovery
on:
  pull_request:
  push:
    branches: ['fix/workflow-recovery-dispatch-20261031']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.0', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kswarm
    steps:
      - uses: actions/checkout@v4
        with:
          path: kswarm
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/intent-broker
          ref: 21defd02854fc38ae7526cdff9de3f46bf137311
          path: intent-broker
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: kswarm/package-lock.json
      - name: Install the pinned original Broker dependencies
        working-directory: intent-broker
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: node --test test/managed-renderer-routing.test.js test/synthesis-final-format.test.js test/workflow-blocked-source-recovery.test.js test/workflow-dependency-artifacts.test.js test/watchdog-workflow-ownership.test.js test/project-continue-workflow.test.js test/task-dispatch-delivery.test.js
      - run: node test/execution-mode-selector.test.js
      - run: npm test
        if: runner.os == 'Linux'
      - run: npm run test:all
        if: runner.os == 'Linux'
