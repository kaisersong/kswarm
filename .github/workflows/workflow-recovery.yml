name: Workflow recovery
on:
  pull_request:
  push:
    branches: ['fix/workflow-recovery-dispatch-20261031']
  workflow_dispatch:
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.22.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test test/managed-renderer-routing.test.js test/synthesis-final-format.test.js test/workflow-blocked-source-recovery.test.js test/workflow-dependency-artifacts.test.js test/watchdog-workflow-ownership.test.js test/project-continue-workflow.test.js test/task-dispatch-delivery.test.js
      - run: node test/execution-mode-selector.test.js
      - run: npm test
        if: runner.os == 'Linux'
      - run: npm run test:all
        if: runner.os == 'Linux'
